function visualFor(i){const v=[
["🔥","<div class='flame2'>🔥</div><p class='note'>酸素があると燃焼が続きます。</p>","🫙 びんをかぶせる","runFire()"],
["🫀","<div class='heart'>❤️</div><div class='flow'><span class='node'>🫁 肺</span><span class='arrow'>→</span><span class='node'>❤️ 心臓</span><span class='arrow'>→</span><span class='node'>🧍 全身</span></div>","🫁 呼吸を観察","runBody()"],
["🌱","<div class='plant'>🌱</div><div class='flow'><span class='node'>💧 根</span><span class='arrow'>→</span><span class='node'>🌿 茎</span><span class='arrow'>→</span><span class='node'>🍃 葉</span></div>","☀️ 光を当てる","runPlant()"],
["🧪","<div class='molecule'>💧 ＋ 🧂 → 🧂💧</div><p class='note'>物質が水にとけて均一になります。</p>","💨 水を蒸発させる","runSolution()"],
["🌙","<div class='orbit'><div class='sun'>☀️</div><div class='moon'>🌙</div></div>","🌙 月を動かす","runSpace()"],
["🌍","<div class='layers'><span>🌱 表土</span><span>🏖️ 砂</span><span>🪨 泥・れき</span><span>🌋 火山灰</span></div>","🔎 地層を観察","runEarth()"],
["🌳","<div class='food'>🌱 → 🐛 → 🐦</div><p class='note'>食べる・食べられる関係がつながっています。</p>","🔄 食物連鎖を動かす","runEnvironment()"],
["⚡","<div class='circuit-scene' id='circuitScene'><div class='cwire top'></div><div class='cwire left'></div><div class='cwire right'></div><div class='cwire bottom-left'></div><div class='cwire bottom-right'></div><div class='cbattery'>🔋</div><div class='cbulb'>💡</div><div class='cgap'></div><div class='cswitch'>スイッチ OFF</div><div class='electron'></div></div><p class='note'>青い玉＝電気の流れをイメージしたもの</p>","🔘 スイッチを入れる","runElectric()"],
["⚖️","<div class='lever'></div><div class='fulcrum'></div><div class='weight'>📦</div><div class='force'>👇</div>","👇 力を加える","runLever()"]
];return v[i]}
function openUnit(i){current=i;const u=units[i];document.getElementById("unitTitle").textContent=u.emoji+" "+u.title;document.getElementById("unitIntro").textContent=u.intro;document.getElementById("learnCards").innerHTML=u.cards.map(c=>"<div class='learn-card'><b>"+c[0]+"</b><p>"+c[1]+"</p></div>").join("");const v=visualFor(i),x=experimentConfig(i);document.getElementById("experimentSection").innerHTML="<div class='section'><h2>🧪 予想してから実験！</h2><div class='viz'><div class='diagram' id='visual'>"+v[1]+"</div><div><h3>"+v[0]+" どうなると思う？</h3><p class='note'><b>① まず予想</b> → ② 答えを確認 → ③ 実験を見る → ④ なぜか考える</p><div class='choices' id='predictionChoices'>"+x.a.map((a,j)=>"<button class='choice' onclick='predict("+j+")'>"+String.fromCharCode(65+j)+". "+a+"</button>").join("")+"</div><div class='experiment-actions'><button id='experimentBtn' class='btn primary' onclick='runPredictedExperiment()' disabled>"+v[2]+"</button><button class='btn light' onclick='resetVisual()'>↺ もう一度</button></div><div id='expResult' class='resultbox'>まだ実験はしていません。まず予想を選ぼう！</div></div></div></div><div class='section'><h2>🔬 条件を変えて比べる実験</h2><div class='compare-box' id='compareBox'><div id='compareQuestion'></div><div class='compare-controls' id='compareControls'></div><div id='comparePrediction'></div><div id='compareResults' class='compare-results'><div class='compare-card'><b>A</b><p>まだ実験していません</p></div><div class='compare-card'><b>B</b><p>まだ実験していません</p></div></div><div id='compareConclusion' class='resultbox'>まず「何を変えるか」を確認しよう！</div></div></div>";document.getElementById("tip").style.display="none";setupComparison();show("unit")}
function setupComparison(){const x=compareConfig(current),q=document.getElementById("compareQuestion"),ctrl=document.getElementById("compareControls"),pred=document.getElementById("comparePrediction"),res=document.getElementById("compareResults"),con=document.getElementById("compareConclusion");if(!q)return;q.innerHTML="<span class='compare-step'>STEP 1</span><h3>"+x.title+"</h3><div class='compare-instruction'>"+x.action+"</div><p class='note'><b>"+x.label+"を変えて、結果の違いを比べます。</b></p>";ctrl.innerHTML=x.opts.map((o,j)=>"<button id='compareOpt"+j+"' class='compare-btn' onclick='selectCompareCondition("+j+")'><b>"+(j===0?"A":"B")+"："+o+"</b><br><span class='note'>この条件で実験します</span></button>").join("");pred.innerHTML="<div class='compare-prediction'><span class='compare-step'>STEP 2</span><div class='compare-question'>"+x.question+"</div><div class='compare-controls'>"+x.opts.map((o,j)=>"<button class='compare-btn' onclick='predictComparison("+j+")'>"+(j===0?"A":"B")+"だと思う</button>").join("")+"</div><button id='compareRunBtn' class='btn primary compare-action' onclick='runComparison()' disabled>🔬 2つの条件を実験して結果を見る</button></div>";res.innerHTML="<div class='compare-card'><b>A："+x.opts[0]+"</b><p>実験すると結果が表示されます</p></div><div class='compare-card'><b>B："+x.opts[1]+"</b><p>実験すると結果が表示されます</p></div>";con.textContent="予想を選んでから、実験ボタンを押して結果を確かめよう！"}function selectCompareCondition(j){document.querySelectorAll("#compareControls .compare-btn").forEach((b,k)=>b.classList.toggle("selected",k===j));document.getElementById("compareConclusion").textContent="AとBは「結果」ではなく、比べるための条件です。次に結果を予想してみよう！"}function predictComparison(j){const x=compareConfig(current),bs=document.querySelectorAll("#comparePrediction .compare-btn");bs.forEach((b,k)=>{b.disabled=true;if(k===j)b.classList.add("selected")});document.getElementById("compareRunBtn").disabled=false;document.getElementById("compareConclusion").innerHTML="🤔 予想は <b>"+(j===0?"A":"B")+"："+x.opts[j]+"</b>。まだ正解は見せません。実験して確かめよう！";}function runComparison(){const x=compareConfig(current),res=document.getElementById("compareResults"),con=document.getElementById("compareConclusion"),pred=document.getElementById("comparePrediction");res.innerHTML="<div class='compare-card done'><b>A："+x.opts[0]+"</b><p>🔬 実験結果：<br>"+x.result[0]+"</p></div><div class='compare-card done'><b>B："+x.opts[1]+"</b><p>🔬 実験結果：<br>"+x.result[1]+"</p></div>";pred.innerHTML="<div class='compare-prediction'><span class='compare-step'>STEP 2</span><div class='compare-question'>"+x.question+"</div><div class='resultbox ok'>👀 実験結果が出ました。AとBを比べてみよう！</div></div><div class='compare-prediction'><span class='compare-step'>STEP 3</span><div class='compare-question'>"+x.afterQuestion+"</div><div class='compare-controls'>"+x.afterOpts.map((o,j)=>"<button class='compare-btn' onclick='answerComparison("+j+")'>"+(j===0?"A":"B")+"："+o+"</button>").join("")+"</div></div>";con.textContent="実験結果を見て、どちらが当てはまるか選ぼう！"}function answerComparison(j){const x=compareConfig(current),bs=document.querySelectorAll("#comparePrediction .compare-controls:last-of-type .compare-btn");bs.forEach((b,k)=>{b.disabled=true;if(k===x.correct)b.classList.add("selected")});const ok=j===x.correct;document.getElementById("compareConclusion").innerHTML=ok?"🎉 <b>正解！</b><br>"+x.why:"🤔 <b>おしい！</b><br>正解は「"+(x.correct===0?"A":"B")+"："+x.afterOpts[x.correct]+"」<br>"+x.why;if(ok){state.xp+=5;save()}}
function resetVisual(){openUnit(current)}
function predict(i){const x=experimentConfig(current),bs=document.querySelectorAll("#predictionChoices .choice");bs.forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add("correct");if(j===i&&i!==x.c)b.classList.add("wrong")});document.getElementById("experimentBtn").disabled=false;const ok=i===x.c;document.getElementById("expResult").innerHTML=ok?"🎯 <b>予想的中！</b> 実験で確かめてみよう。":"🤔 <b>予想は"+String.fromCharCode(65+x.c)+"。</b> 実験で確かめてみよう。";state.xp+=1;save()}
function runPredictedExperiment(){[runFire,runBody,runPlant,runSolution,runSpace,runEarth,runEnvironment,runElectric,runLever][current]()}

function runFire(){document.getElementById("visual").innerHTML="<div class='flame2' style='opacity:.25'>🔥</div><div class='gas'>🌬️ 💨</div>";setResult("🔥 <b>火が消えました。</b><br>酸素が燃焼に使われ、少なくなったためです。")}
function runBody(){document.getElementById("visual").innerHTML="<div class='heart'>❤️</div><div class='flow'><span class='node'>🫁 酸素</span><span class='arrow'>→</span><span class='node'>❤️ 血液</span><span class='arrow'>→</span><span class='node'>💪 筋肉</span></div>";setResult("🫁 <b>酸素の旅：</b>肺から取り入れた酸素は血液によって全身へ運ばれます。")}
function runPlant(){document.getElementById("visual").innerHTML="<div class='plant'>🌱</div><div class='flow'><span class='node'>☀️ 光</span><span class='arrow'>＋</span><span class='node'>💧 水</span><span class='arrow'>＋</span><span class='node'>🌬️ CO₂</span><span class='arrow'>→</span><span class='node'>🍚 養分</span></div>";setResult("🌱 <b>光合成：</b>光を利用して、二酸化炭素と水から養分をつくります。")}
function runSolution(){document.getElementById("visual").innerHTML="<div class='molecule'>💧💨💨💨</div><div class='node'>🧂 とけた物質が残る</div>";setResult("🧪 <b>蒸発：</b>水が水蒸気になって出ていくと、とけていた物質が残ります。")}
function runSpace(){document.getElementById("visual").innerHTML="<div class='orbit'><div class='sun'>☀️</div><div class='moon'>🌙</div></div><p class='note'>月は太陽の光を反射して見えます。</p>";setResult("🌙 <b>満ち欠け：</b>月と太陽と地球の位置関係によって、照らされた部分の見え方が変わります。")}
function runEarth(){document.getElementById("visual").innerHTML="<div class='layers'><span>🌱 新しい地層</span><span>🏖️ 砂</span><span>🪨 泥・れき</span><span>🦴 化石</span></div>";setResult("🌍 <b>地層を読む：</b>地層には大地の歴史が残っています。化石は昔の生物や環境を知る手がかりです。")}
function runEnvironment(){document.getElementById("visual").innerHTML="<div class='food'>🌱 → 🐛 → 🐦 → 🦅</div><div class='node'>食べる・食べられる関係</div>";setResult("🌳 <b>食物連鎖：</b>生物は食べる・食べられる関係でつながっています。")}
function runElectric(){const scene=document.getElementById("circuitScene");if(!scene)return;scene.classList.add("closed");scene.querySelector(".cswitch").textContent="スイッチ ON";setResult("⚡ <b>道が一周つながった！</b><br>青い玉が道をぐるっと進み、電球が光ります。回路が切れずにつながると電流が流れます。")}
function runLever(){document.getElementById("visual").innerHTML="<div class='lever' style='transform:rotate(8deg)'></div><div class='fulcrum'></div><div class='weight'>📦</div><div class='force'>👇</div>";setResult("⚖️ <b>てこの原理：</b>力点を支点から遠くすると、少ない力で動かしやすくなります。")}
function markLearn(){if(!state.learned.includes(current)){state.learned.push(current);state.xp+=10;save()}alert("📖 学習完了！ +10 XP")}
function showTip(){const e=document.getElementById("tip");e.textContent="💡 "+units[current].tip;e.style.display="block"}
function runExperiment(){const f=document.getElementById("flame"),r=document.getElementById("expResult");f.classList.add("off");r.innerHTML="👀 <b>観察結果：</b>しばらくすると火が消えました。<br>💡 びんの中の酸素が燃焼に使われ、少なくなったからです。";if(!state.learned.includes(0)){state.learned.push(0);state.xp+=10;save()}}
function resetExperiment(){document.getElementById("flame").classList.remove("off");document.getElementById("expResult").textContent="観察ポイント：火はどうなるかな？"}
function startQuiz(){qi=0;score=0;answered=false;show("quiz");renderQ()}
function renderQ(){const q=units[current].qs[qi];document.getElementById("qnum").textContent="第"+(qi+1)+"問 / "+units[current].qs.length;document.getElementById("qscore").textContent=score;document.getElementById("qbar").style.width=(qi/units[current].qs.length*100)+"%";document.getElementById("quizbody").innerHTML="<div class='question'>"+q[0]+"</div><div class='choices'>"+q[1].map((c,i)=>"<button class='choice' onclick='answer("+i+")'>"+String.fromCharCode(65+i)+". "+c+"</button>").join("")+"</div><div id='fb' class='feedback'></div>"}
function answer(i){if(answered)return;answered=true;const q=units[current].qs[qi],bs=document.querySelectorAll(".choice"),fb=document.getElementById("fb");bs.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add("correct");if(j===i&&i!==q[2])b.classList.add("wrong")});const ok=i===q[2];if(ok){score++;state.xp+=5;fb.className="feedback ok";fb.innerHTML="🎉 <b>正解！</b><br>"+q[3]}else{state.mistakes.push(current+"-"+qi);fb.className="feedback ng";fb.innerHTML="😢 <b>おしい！</b><br>正解は「"+q[1][q[2]]+"」<br>"+q[3]}fb.style.display="block";const n=document.createElement("button");n.className="btn primary";n.style.marginTop="14px";n.textContent=qi===units[current].qs.length-1?"結果を見る":"次の問題へ";n.onclick=()=>{if(qi===units[current].qs.length-1)finishQuiz();else{qi++;answered=false;renderQ()}};document.getElementById("quizbody").appendChild(n);save()}
function finishQuiz(){if(score>=8&&!state.cleared.includes(current)){state.cleared.push(current);state.xp+=30}document.getElementById("completeTitle").textContent=score>=8?"🏆 ステージクリア！":"📚 もう一歩！";document.getElementById("completeText").innerHTML=units[current].emoji+" "+units[current].title+"<br><b>10問中 "+score+"問正解</b><br>"+(score===10?"👑 パーフェクト！すごい！":score>=8?"🎉 マスター認定！":"💪 学習カードを復習して再挑戦しよう！");show("complete");save()}
function renderMap(){document.getElementById("map").innerHTML=units.map((u,i)=>{const p=state.cleared.includes(i)?100:state.learned.includes(i)?30:0;return "<div class='unit'><div class='big'>"+u.emoji+"</div><h3>"+(i+1)+". "+u.title+"</h3><div class='meter'><i style='width:"+p+"%'></i></div><p>"+p+"% "+(p===100?"🏆 クリア！":p?"📖 学習済み":"▶ 挑戦できます")+"</p><button class='btn primary' onclick='openUnit("+i+")'>冒険する</button></div>"}).join("")}
function renderBadges(){const bs=[["🔥","燃焼マスター",state.cleared.includes(0)],["🫀","人体博士",state.cleared.includes(1)],["🌱","植物博士",state.cleared.includes(2)],["🧪","水溶液マスター",state.cleared.includes(3)],["🌙","宇宙探検家",state.cleared.includes(4)],["🌍","地層ハンター",state.cleared.includes(5)],["🌳","環境レンジャー",state.cleared.includes(6)],["⚡","電気マスター",state.cleared.includes(7)],["⚖️","てこ・水博士",state.cleared.includes(8)],["👑","理科博士",state.cleared.length===9]];document.getElementById("badges").innerHTML=bs.map(b=>"<div class='badgecard "+(b[2]?"":"locked")+"'><div>"+b[0]+"</div><b>"+b[1]+"</b><p>"+(b[2]?"獲得！":"未獲得")+"</p></div>").join("")}
renderMap();renderBadges();updateStats();
</script></body></html>
