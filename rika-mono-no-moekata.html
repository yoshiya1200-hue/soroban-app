<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 理科クイズ！ものの燃え方・気体</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff7d6,#e7f7ff);color:#263238}.app{max-width:760px;margin:0 auto;padding:20px 16px 40px}.hero{background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.1);margin-bottom:16px}.hero .fire{font-size:64px}h1{margin:4px 0 8px;font-size:30px}.subtitle{margin:0;color:#607d8b;font-weight:bold}.status{display:flex;gap:10px;margin:12px 0}.badge{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.07);font-weight:bold}.progress{height:12px;background:#dce6ea;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;width:0;background:#ff9800;transition:width .35s}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.1)}.qnum{color:#ef6c00;font-weight:900;font-size:18px}.question{font-size:25px;line-height:1.55;font-weight:900;margin:10px 0 20px}.choices{display:grid;gap:12px}button.choice{border:3px solid #e0e0e0;background:#fafafa;border-radius:16px;padding:15px;text-align:left;font-size:18px;font-weight:bold;cursor:pointer;transition:.15s}button.choice:hover{transform:translateY(-2px);border-color:#ffb74d;background:#fff8e1}button.choice:disabled{cursor:default}.correct{background:#e8f5e9!important;border-color:#43a047!important}.wrong{background:#ffebee!important;border-color:#e53935!important}.feedback{display:none;margin-top:18px;border-radius:18px;padding:18px;line-height:1.65}.feedback.correctBox{background:#e8f5e9}.feedback.wrongBox{background:#ffebee}.feedback strong{font-size:21px}.explain{margin-top:8px;background:rgba(255,255,255,.65);padding:12px;border-radius:12px}.next{display:none;width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;background:#ff9800;color:#fff;font-size:19px;font-weight:900;cursor:pointer}.next:hover{background:#f57c00}.result{display:none;text-align:center}.trophy{font-size:72px}.score{font-size:48px;font-weight:900;color:#ef6c00}.restart{border:0;background:#1976d2;color:#fff;border-radius:16px;padding:14px 24px;font-size:18px;font-weight:bold;cursor:pointer}.tip{margin-top:18px;color:#546e7a;font-size:14px;text-align:center}@media(max-width:520px){h1{font-size:25px}.question{font-size:21px}button.choice{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<div class="hero"><div class="fire">🔥</div><h1>理科クイズ！</h1><p class="subtitle">ものの燃え方・気体をマスターしよう！</p></div>
<div class="status"><div class="badge">📘 問題 <span id="number">1</span> / 15</div><div class="badge">⭐ スコア <span id="score">0</span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="quizCard"><div class="qnum" id="qnum">🔥 第1問</div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"><strong id="resultTitle"></strong><div class="explain" id="explain"></div></div><button class="next" id="next" onclick="nextQuestion()">次の問題へ ➡️</button></div>
<div class="card result" id="resultCard"><div class="trophy" id="trophy">🏆</div><h2>クイズ終了！</h2><div class="score"><span id="finalScore">0</span> / 15</div><h2 id="rank"></h2><p id="comment"></p><button class="restart" onclick="restart()">🔄 もう一度挑戦する</button></div>
<div class="tip">💡 間違えても大丈夫！解説を読んで覚えればOK！</div>
</div>
<script>
const questions=[
["空気の中で、いちばん多く入っている気体は？",["酸素","二酸化炭素","窒素","水蒸気"],2,"空気の約78%が窒素です。酸素は約21%です。"],
["空気の中に約21%入っている気体は？",["酸素","窒素","二酸化炭素","水素"],0,"空気の約21%が酸素です。ものを燃やすはたらきがあります。"],
["ろうそくが燃えるために必要な気体は？",["窒素","酸素","二酸化炭素","ヘリウム"],1,"酸素には、ものを燃やすはたらきがあります。"],
["ろうそくを燃やし続けると、空気中の酸素はどうなる？",["増える","減る","変わらない","水になる"],1,"ろうそくが燃えると酸素が使われるので、酸素は減ります。"],
["ろうそくを燃やすと、二酸化炭素はどうなる？",["増える","減る","なくなる","酸素になる"],0,"ろうそくが燃えると二酸化炭素ができます。そのため増えます。"],
["二酸化炭素があるかどうかを調べるときに使う液体は？",["水","食塩水","石灰水","砂糖水"],2,"石灰水に二酸化炭素を通すと、白くにごります。"],
["二酸化炭素を石灰水に通すと、どうなる？",["赤くなる","青くなる","白くにごる","泡が全部消える"],2,"二酸化炭素が入ると、石灰水は白くにごります。"],
["酸素の中にろうそくを入れると、空気中よりどう燃える？",["弱く燃える","同じように燃える","激しく燃える","燃えなくなる"],2,"酸素が多いと、ものはより激しく燃えます。"],
["ろうそくが燃えるための条件として正しい組み合わせは？",["燃える物・酸素・十分な温度","水・氷・空気","二酸化炭素・水・冷たさ","光・水・土"],0,"燃える物・酸素・燃えるために十分な温度。この3つが大切です。"],
["ろうそくをびんの中で燃やすと、やがて消えるのはなぜ？",["ろうそくが水を吸うから","酸素が少なくなるから","窒素がなくなるから","光がなくなるから"],1,"燃え続けることで酸素が使われ、びんの中の酸素が少なくなるためです。"],
["ものが燃えるとき、酸素と結びついて出てくるものは？",["熱や光","氷","土","音だけ"],0,"燃焼では、熱や光が出ます。炎が明るく熱いのはそのためです。"],
["次のうち、ものを燃やすはたらきがない気体は？",["酸素","二酸化炭素","どちらも燃やす","どちらも同じ"],1,"二酸化炭素には、ものを燃やすはたらきがありません。"],
["空気の約78%を占める気体は？",["酸素","窒素","二酸化炭素","水素"],1,"空気の約78%は窒素。『78%＝窒素、21%＝酸素』をセットで覚えよう！"],
["空気中の酸素と窒素では、どちらが多い？",["酸素","窒素","同じ","日によって変わる"],1,"窒素のほうが多いです。窒素約78%、酸素約21%です。"],
["🔥 最終問題！『ものが燃える』について正しいのはどれ？",["酸素がなくても燃える","二酸化炭素が多いほどよく燃える","酸素があると燃えやすい","冷たくすると必ずよく燃える"],2,"燃える物・酸素・十分な温度がそろうと、ものは燃えます。"]
];
let current=0,score=0,answered=false;
const labels=["🅰️","🅱️","🅲️","🅳️"];
function showQuestion(){answered=false;const x=questions[current];number.textContent=current+1;qnum.textContent="🔥 第"+(current+1)+"問";question.textContent=x[0];scoreEl();bar.style.width=(current/questions.length*100)+"%";choices.innerHTML="";x[1].forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=labels[i]+" "+c;b.onclick=()=>answer(i,b);choices.appendChild(b)});feedback.style.display="none";next.style.display="none"}
function scoreEl(){scoreSpan.textContent=score}
function answer(selected,clicked){if(answered)return;answered=true;const x=questions[current],bs=document.querySelectorAll(".choice");bs.forEach(b=>b.disabled=true);bs[x[2]].classList.add("correct");if(selected===x[2]){score++;clicked.classList.add("correct");resultTitle.textContent="🎉 正解！すごい！";feedback.className="feedback correctBox"}else{clicked.classList.add("wrong");resultTitle.textContent="😯 おしい！正解は「"+x[1][x[2]]+"」";feedback.className="feedback wrongBox"}explain.textContent="💡 "+x[3];feedback.style.display="block";scoreEl();bar.style.width=((current+1)/questions.length*100)+"%";next.textContent=current===questions.length-1?"結果を見る 🏆":"次の問題へ ➡️";next.style.display="block"}
function nextQuestion(){if(current<questions.length-1){current++;showQuestion()}else showResult()}
function showResult(){quizCard.style.display="none";resultCard.style.display="block";finalScore.textContent=score;let r,c,t;if(score===15){r="👑 理科マスター！";c="すごい！ものの燃え方と気体はバッチリです！";t="👑"}else if(score>=12){r="🏆 理科博士！";c="かなり強い！あと少しでパーフェクト！";t="🏆"}else if(score>=9){r="⭐ 理科名人！";c="いい感じ！まちがえた問題をもう一度覚えよう。";t="⭐"}else if(score>=6){r="💪 理科チャレンジャー！";c="ここから伸びるぞ！解説を読んでもう一度挑戦しよう。";t="💪"}else{r="🌱 理科ビギナー！";c="大丈夫！知らなかったことを覚えるのが勉強。もう一回やってみよう！";t="🌱"}rank.textContent=r;comment.textContent=c;trophy.textContent=t}
function restart(){current=0;score=0;quizCard.style.display="block";resultCard.style.display="none";showQuestion()}
const number=document.getElementById("number"),scoreSpan=document.getElementById("score"),bar=document.getElementById("bar"),qnum=document.getElementById("qnum"),question=document.getElementById("question"),choices=document.getElementById("choices"),feedback=document.getElementById("feedback"),resultTitle=document.getElementById("resultTitle"),explain=document.getElementById("explain"),next=document.getElementById("next"),quizCard=document.getElementById("quizCard"),resultCard=document.getElementById("resultCard"),finalScore=document.getElementById("finalScore"),rank=document.getElementById("rank"),comment=document.getElementById("comment"),trophy=document.getElementById("trophy");
showQuestion();
</script>
</body>
</html>
